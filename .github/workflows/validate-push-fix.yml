name: Validate Islanda push fix

on:
  push:
    branches:
      - fix/push-notifications

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/push-notifications

      - name: Check JavaScript syntax
        run: |
          node --check push-notifications.js
          node --check sw.js
          node --check push/onesignal/OneSignalSDKWorker.js

      - name: Check integration invariants
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')
          push = Path('push-notifications.js').read_text(encoding='utf-8')
          worker = Path('push/onesignal/OneSignalSDKWorker.js').read_text(encoding='utf-8')

          assert 'push-notifications.js' in index
          assert 'Notifications.requestPermission();' not in index
          assert 'serviceWorkerPath: "/sw.js"' not in index
          assert 'window.IslandaPush.identify(match)' in index
          assert "Registrazione service worker fallita" in index
          assert 'OneSignalSDK.sw.js' not in sw
          assert 'push-notifications.js' in sw
          assert 'serviceWorkerPath: "push/onesignal/OneSignalSDKWorker.js"' in push
          assert 'serviceWorkerParam: { scope: "/push/onesignal/" }' in push
          assert 'OneSignal.Notifications.requestPermission()' in push
          assert 'OneSignal.User.PushSubscription.optIn()' in push
          assert 'OneSignal.login' in push
          assert 'OneSignalSDK.sw.js' in worker

      - name: Remove one-shot validation workflow
        run: |
          rm .github/workflows/validate-push-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-push-fix.yml
          git commit -m "Conferma validazione integrazione push"
          git push origin HEAD:fix/push-notifications
