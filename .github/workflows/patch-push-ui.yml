name: Patch Islanda push UI

on:
  push:
    branches:
      - fix/push-notifications

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/push-notifications

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          init_pattern = re.compile(
              r'\s*<script src="https://cdn\.onesignal\.com/sdks/web/v16/OneSignalSDK\.page\.js" defer></script>\s*'
              r'<script>\s*window\.OneSignalDeferred = window\.OneSignalDeferred \|\| \[\];\s*'
              r'OneSignalDeferred\.push\(async function\(OneSignal\) \{.*?'
              r'await OneSignal\.Notifications\.requestPermission\(\);\s*\}\);\s*</script>',
              re.S,
          )
          text, count = init_pattern.subn(
              '\n<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>\n<script src="push-notifications.js" defer></script>',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Patch init OneSignal non applicata: {count}")

          identity_pattern = re.compile(
              r'\s*window\.currentUser = match;\s*window\.currentUser = match;\s*'
              r'// Tagga questo dispositivo.*?'
              r'window\.OneSignalDeferred\.push\(function\(OneSignal\) \{\s*'
              r'OneSignal\.User\.addTag\("username", match\);\s*\}\);',
              re.S,
          )
          text, count = identity_pattern.subn(
              '\n    window.currentUser = match;\n    if (window.IslandaPush) {\n      void window.IslandaPush.identify(match);\n    }',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Patch identità non applicata: {count}")

          sw_pattern = re.compile(
              r"navigator\.serviceWorker\.register\('sw\.js'\)\.catch\(\(\) => \{\s*"
              r"// se il file sw\.js non è presente o l'ambiente non supporta HTTPS, si ignora silenziosamente\s*"
              r"\}\);"
          )
          text, count = sw_pattern.subn(
              "navigator.serviceWorker.register('sw.js').catch((error) => {\n        console.error('[Islanda PWA] Registrazione service worker fallita:', error);\n      });",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Patch diagnostica SW non applicata: {count}")

          path.write_text(text, encoding="utf-8")

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/patch-push-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-push-ui.yml
          git commit -m "Collega la nuova gestione push alla pagina"
          git push origin HEAD:fix/push-notifications
